<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width" />

    <title>Parrot Party Clicker</title>
    <link href="styles/styles.css" rel="stylesheet" type="text/css" />
    <script defer src="src/index.js" type="text/javascript"></script>
  </head>
  <body>
    <h1 id="counter">Clicks: 0</h1>
    <p>
      <button id="reset">Reset</button>
    </p>

    <img
      id="parrot-img"
      src="https://cultofthepartyparrot.com/parrots/hd/parrot.gif"
    />

    <!--  TODO: Add reset button -->

    <!--  Extra: -->
    <main>
      <div id="box-one" class="box box--mouseover">
        <p>hover over me</p>
      </div>
      <div id="box-two" class="box box--keydown">
        <p>press space</p>
      </div>
      <div id="box-three" class="box box--click">
        <p>click me</p>
      </div>
      <div id="box-four" class="box box--dblclick">
        <p>double click me</p>
      </div>
    </main>
  </body>
</html>
